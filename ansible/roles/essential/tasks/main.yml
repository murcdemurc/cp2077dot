- name: Install essential packages
  become: true
  ansible.builtin.package:
    name:
      - git
      - curl
      - base-devel

      - pipewire
      - wireplumber
      - pipewire-pulse
      - mesa
      - power-profiles-daemon
      - bluez

      - mako
      - sddm
      - niri
      - ttf-jetbrains-mono-nerd
      - ghostty
      - alacritty
      - dolphin

      - polkit-gnome
      - xdg-utils
      - xorg-xwayland
      - amd-ucode
      - efibootmgr
      - grub
      - linux
      - linux-firmware
      - networkmanager
      - network-manager-applet

    state: present

- name: Enable system services
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    daemon_reload: true
  loop:
    - sddm
    - NetworkManager
    - bluetooth

- name: Enable user services (pipewire)
  become: false
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    scope: user
    daemon_reload: true
  loop:
    - pipewire
    - wireplumber
    - pipewire-pulse

- name: Ensure /etc/sudoers.d exists
  become: true
  ansible.builtin.file:
    path: /etc/sudoers.d
    state: directory
    mode: '0750'

- name: Copy sudoers rule for paru
  become: true
  ansible.builtin.copy:
    content: "{{ ansible_env.USER }} ALL=(ALL) NOPASSWD: /usr/bin/pacman, /usr/bin/paru\n"
    dest: /etc/sudoers.d/10-murc-paru
    mode: '0440'
    owner: root
    group: root
    validate: /usr/sbin/visudo -cf %s

- name: Remove old sudoers file from chezmoi source
  become: false
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/share/chezmoi/etc_sudoers.d/10-murc-paru"
    state: absent

- name: Check if paru is installed
  become: false
  ansible.builtin.command:
    cmd: which paru
  register: paru_check
  failed_when: false
  changed_when: false

- name: Clone paru repository
  become: false
  ansible.builtin.git:
    repo: https://aur.archlinux.org/paru.git
    dest: "{{ ansible_env.HOME }}/paru"
  when: paru_check.rc != 0
  

- name: Build and install paru
  become: false
  ansible.builtin.command:
    cmd: makepkg -si --noconfirm
    chdir: "{{ ansible_env.HOME }}/paru"
  when: paru_check.rc != 0
  changed_when: false

- name: Remove paru build directory
  become: true
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/paru"
    state: absent
  when: paru_check.rc != 0
  
