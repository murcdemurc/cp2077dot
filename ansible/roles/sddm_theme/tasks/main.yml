---
- name: Install SDDM theme dependencies
  become: true
  ansible.builtin.package:
    name:
      - sddm
      - qt6-svg
      - qt6-virtualkeyboard
      - qt6-multimedia-ffmpeg
      - qt6-imageformats
    state: present

- name: Copy sddm-astronaut-theme to SDDM themes directory
  become: true
  ansible.builtin.copy:
    src: sddm-astronaut-theme/
    dest: /usr/share/sddm/themes/sddm-astronaut-theme/

- name: Install theme fonts
  become: true
  ansible.builtin.copy:
    src: sddm-astronaut-theme/Fonts/
    dest: /usr/share/fonts/

- name: Refresh font cache
  become: true
  ansible.builtin.command:
    cmd: fc-cache -f
  changed_when: false

- name: Set theme variant
  become: true
  ansible.builtin.lineinfile:
    path: /usr/share/sddm/themes/sddm-astronaut-theme/metadata.desktop
    regexp: '^ConfigFile=.*'
    line: ConfigFile=Themes/astronaut.conf
