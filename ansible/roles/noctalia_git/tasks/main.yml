---
- name: Install noctalia-git AUR package
  kewlfft.aur.aur:
    name: noctalia-git
    use: paru
  become: false

- name: Create wallpapers directory
  become: false
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/Pictures/Wallpapers"
    state: directory

- name: Copy noctalia wallpaper
  become: false
  ansible.builtin.copy:
    src: wallhaven_7p6g99.jpg
    dest: "{{ ansible_env.HOME }}/Pictures/Wallpapers/wallhaven_7p6g99.jpg"
