- name: Configure localhost
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    install_grub_theme: true
    install_sddm_theme: true
    install_essential: true
    install_utils: true
    install_noctalia_git: false
    install_noctalia_shell: true
    install_services: true
    install_aur_leisure: true
    install_aur_work: false
    install_gaming: true
    install_productivity: false
    install_ltr: false

  tasks:

    - name: grub_theme
      ansible.builtin.include_role:
        name: grub_theme
      when: install_grub_theme | bool

    - name: sddm_theme
      ansible.builtin.include_role:
        name: sddm_theme
      when: install_sddm_theme | bool

    - name: essential
      ansible.builtin.include_role:
        name: essential
      when: install_essential | bool

    - name: noctalia_git
      block:
        - name: Run noctalia_git role
          ansible.builtin.include_role:
            name: noctalia_git
      rescue:
        - name: noctalia_git failed, continuing
          ansible.builtin.debug:
            msg: "noctalia_git role failed, continuing with remaining roles"
      when: install_noctalia_git | bool

    - name: noctalia_shell
      block:
        - name: Run noctalia_shell role
          ansible.builtin.include_role:
            name: noctalia_shell
      rescue:
        - name: noctalia_shell failed, continuing
          ansible.builtin.debug:
            msg: "noctalia_shell role failed, continuing with remaining roles"
      when: install_noctalia_shell | bool

    - name: aur_leisure
      block:
        - name: Run aur_leisure role
          ansible.builtin.include_role:
            name: aur_leisure
      rescue:
        - name: aur_leisure failed, continuing
          ansible.builtin.debug:
            msg: "aur_leisure role failed, continuing with remaining roles"
      when: install_aur_leisure | bool

    - name: aur_work
      block:
        - name: Run aur_work role
          ansible.builtin.include_role:
            name: aur_work
      rescue:
        - name: aur_work failed, continuing
          ansible.builtin.debug:
            msg: "aur_work role failed, continuing with remaining roles"
      when: install_aur_work | bool

    - name: gaming
      ansible.builtin.include_role:
        name: gaming
      when: install_gaming | bool

    - name: utils
      ansible.builtin.include_role:
        name: utils
      when: install_utils | bool

    - name: productivity
      ansible.builtin.include_role:
        name: productivity
      when: install_productivity | bool

    - name: ltr
      ansible.builtin.include_role:
        name: ltr
      when: install_ltr | bool

    - name: services
      ansible.builtin.include_role:
        name: services
      when: install_services | bool
